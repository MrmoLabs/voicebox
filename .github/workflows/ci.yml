name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

      - name: Build desktop frontend
        run: bun run --cwd app build

      - name: Shared playback and history regression
        run: bun test scripts/tests/agentSpeechPlayback.test.ts scripts/tests/agentSpeechQueue.test.ts scripts/tests/pcmPackets.test.ts scripts/tests/historyReconciliation.test.ts scripts/tests/speechPlayerComparison.test.ts

  dsh-voice-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install plugin build dependencies
        working-directory: integrations/dsh-voicebox
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Plugin source lint
        run: bun node_modules/@biomejs/biome/bin/biome lint integrations/dsh-voicebox/src
      - name: Plugin regression
        working-directory: integrations/dsh-voicebox
        run: bun run test
      - name: Fetch the fixed previously committed package baseline
        run: git fetch --no-tags --depth=1 origin 249ace262eed07591cfce6353160824e7631f1f9
      - name: Build and verify distributable in isolation
        working-directory: integrations/dsh-voicebox
        run: bun run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-voicebox-candidate-${{ matrix.os }}
          path: release/dsh-voicebox-candidate/*

  voice-backend-regression:
    runs-on: ubuntu-latest
    env:
      VOICEBOX_TEST_PORTABLE: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/tests/requirements-voice.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install regression dependencies
        run: python -m pip install -r backend/tests/requirements-voice.txt
      - name: Run voice contracts without downloaded models
        run: python scripts/run-streaming-tests.py
