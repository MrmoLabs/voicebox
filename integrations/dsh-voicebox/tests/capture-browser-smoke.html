<!doctype html><html lang="zh"><meta charset="utf-8"><title>Voicebox capture lifecycle verification</title>
<style>body{max-width:850px;margin:48px auto;padding:0 24px;font:16px/1.6 system-ui}button{padding:10px 18px}pre{white-space:pre-wrap}</style>
<h1>录入生命周期验收</h1><p>使用真实浏览器音频 API 与静默合成流。不会开启物理麦克风、请求权限或生成可听声音。断开由测试事件模拟，不代表已完成物理设备拔插验收。</p>
<button id="run">运行四项检查</button><pre id="result">尚未运行</pre>
<script type="module">
import { openMicrophone } from '/capture.js';
const assert = (value, message) => { if (!value) throw Error(message); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const until = async predicate => { for (let n = 0; n < 150; n++) { if (predicate()) return; await sleep(20); } throw Error('Audio event timeout'); };
const NativeContext = window.AudioContext, NativeWorklet = window.AudioWorkletNode;
const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
async function scenario(mode) {
  const sourceContext = new NativeContext(); await sourceContext.resume();
  const destination = sourceContext.createMediaStreamDestination();
  const track = destination.stream.getAudioTracks()[0], contexts = [], failures = [];
  let frames = 0, release, handle, errorUrl;
  const abort = new AbortController();
  window.AudioContext = class extends NativeContext {
    constructor(...args) {
      super(...args); contexts.push(this);
      const add = this.audioWorklet.addModule.bind(this.audioWorklet);
      this.audioWorklet.addModule = async url => {
        if (mode === 'initialization-disconnect') await new Promise(resolve => { release = resolve; });
        if (mode === 'fallback-close') throw Error('Simulated CSP module rejection');
        await add(url);
        if (mode === 'processor-error') {
          errorUrl = URL.createObjectURL(new Blob(["registerProcessor('capture-fail', class extends AudioWorkletProcessor { process() { throw Error('Expected fixture processor failure'); } });"], {type:'text/javascript'}));
          await add(errorUrl);
        }
      };
    }
  };
  window.AudioWorkletNode = class extends NativeWorklet {
    constructor(context, name, options) { super(context, mode === 'processor-error' ? 'capture-fail' : name, options); }
  };
  navigator.mediaDevices.getUserMedia = async () => destination.stream;
  try {
    const opening = openMicrophone({ signal:abort.signal, frame:()=>frames++, failed:error=>failures.push(error.message) });
    if (mode === 'initialization-disconnect') {
      await until(() => release);
      track.dispatchEvent(new Event('ended')); release();
      const outcome = await opening.then(value => { handle = value; return ''; }, error => error.message);
      assert(outcome.includes('麦克风已断开'), 'Initialization must reject a disconnected stream');
      assert(failures.length === 1, 'One disconnection failure expected');
    } else {
      handle = await opening;
      if (mode === 'processor-error') {
        await until(() => failures.length > 0);
        assert(failures.length === 1 && failures[0].includes('录音处理'), 'Native processorerror must terminate capture');
      } else {
        await until(() => frames > 0);
        handle.close(); handle.close();
        assert(failures.length === 0, 'Normal close must not report a failure');
      }
    }
    await until(() => contexts.every(context => context.state === 'closed'));
    assert(track.readyState === 'ended', 'The synthetic input track must be stopped');
    const before = frames; await sleep(100); assert(frames === before, 'No frames after capture closes');
    return {mode, passed:true, captureContexts:contexts.length, closedContexts:contexts.filter(context=>context.state==='closed').length, framesBeforeClose:frames, failures:failures.length};
  } finally {
    release?.(); abort.abort(); handle?.close(); track.stop();
    for (const context of contexts) if (context.state !== 'closed') await context.close();
    await sourceContext.close(); if (errorUrl) URL.revokeObjectURL(errorUrl);
    window.AudioContext = NativeContext; window.AudioWorkletNode = NativeWorklet; navigator.mediaDevices.getUserMedia = originalGetUserMedia;
  }
}
document.querySelector('#run').onclick = async event => {
  event.currentTarget.disabled = true;
  const report = { browser:navigator.userAgent, scope:'Native browser AudioContext/AudioWorklet/MediaStream with silent synthetic input; disconnect and CSP failures injected; no hardware permission, physical unplug, ASR or LLM', results:[] };
  try {
    for (const mode of ['normal-close', 'initialization-disconnect', 'processor-error', 'fallback-close']) {
      document.querySelector('#result').textContent = `正在检查：${mode}`;
      report.results.push(await scenario(mode));
    }
    report.passed = true;
  } catch (error) { report.passed = false; report.error = error.message; }
  const saved = await fetch('/result', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(report)});
  report.saved = saved.ok;
  document.querySelector('#result').textContent = JSON.stringify(report, null, 2);
};
</script></html>
